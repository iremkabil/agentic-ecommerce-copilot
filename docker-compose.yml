# One image, two services (api + dashboard). The bind-mount + --reload gives
# you live code reloading during development.
services:
  api:
    build: .
    command: uvicorn copilot.api.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # keep the SQLite file inside the mounted project dir
      - COPILOT_DATABASE_URL=sqlite:////app/copilot.db
    volumes:
      - .:/app

  dashboard:
    build: .
    command: streamlit run dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      - api
